<article class="film-card">
  <span class="film-card__favorite-marker">
    <svg width="56" height="55" viewBox="0 0 56 55" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path
        d="M4.66675 19.2502C4.66617 15.928 6.02565 12.7452 8.43931 10.4177C10.853 8.09023
      14.1181 6.81365 17.5001 6.87517C21.5072 6.85427 25.3307 8.52328 28.0001
      11.4585C30.6694 8.52328 34.493 6.85427 38.5001 6.87517C41.8821 6.81365
      45.1472 8.09023 47.5609 10.4177C49.9745 12.7452 51.334 15.928 51.3334
      19.2502C51.3334 31.5243 36.4491 40.7918 28.0001 48.1252C19.5697
      40.73 4.66675 31.5335 4.66675 19.2502Z"
        [attr.fill]="film().isFavorite ? '#FF0000' : 'none'"
        stroke="#FF0000"
        stroke-width="4"
      />
    </svg>
  </span>
  <a [routerLink]="['/films', film().id]" class="film-card__link">
    <img [src]="film().posterUrl" [alt]="film().title" class="film-card__poster" />
    <div class="film-card__content">
      <div class="film-card__title">{{ film().title }}</div>
      <div class="film-card__meta">{{ film().year }} · {{ film().genre }}i</div>
      <div class="film-card__rating">Rating: {{ film().rating }}</div>
    </div>
  </a>
  <button type="button" class="film-card__button" (click)="toggleFavorite()">Add to favorites</button>
</article>
